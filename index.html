<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Sprint Timer</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #f5f5f5; display: flex; justify-content: center; padding: 40px 20px; margin: 0; }
    .app { width: 100%; max-width: 400px; background: #1e1e1e; padding: 24px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); text-align: center; }
    h1 { font-size: 1.3rem; margin-bottom: 10px; color: #a3e635; }
    .timer { font-size: 4rem; font-weight: bold; margin: 16px 0; font-variant-numeric: tabular-nums; }
    .controls button { background: #a3e635; color: #121212; border: none; padding: 10px 18px; margin: 4px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .controls button.secondary { background: #333; color: #fff; }
    .tasks { margin-top: 24px; text-align: left; }
    .task-input { display: flex; gap: 8px; margin-bottom: 12px; }
    input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #121212; color: #fff; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { background: #262626; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; cursor: pointer; }
    li.done { text-decoration: line-through; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Focus Sprint Timer</h1>
    <div class="timer" id="display">25:00</div>
    <div class="controls">
      <button onclick="startTimer()">Start</button>
      <button class="secondary" onclick="pauseTimer()">Pause</button>
      <button class="secondary" onclick="resetTimer(25)">25m Focus</button>
      <button class="secondary" onclick="resetTimer(5)">5m Break</button>
    </div>

    <div class="tasks">
      <div class="task-input">
        <input type="text" id="taskInput" placeholder="Add a sprint task..." onkeypress="if(event.key==='Enter') addTask()" />
        <button onclick="addTask()" style="background:#a3e635;border:none;border-radius:8px;padding:0 14px;font-weight:bold;cursor:pointer;">+</button>
      </div>
      <ul id="taskList"></ul>
    </div>
  </div>

  <script>
    let seconds = 25 * 60, interval = null;
    const display = document.getElementById('display');
    const updateDisplay = () => {
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      display.textContent = `${m}:${s}`;
    };
    function startTimer() {
      if (interval) return;
      interval = setInterval(() => {
        if (seconds > 0) { seconds--; updateDisplay(); }
        else { clearInterval(interval); interval = null; alert("Time's up!"); }
      }, 1000);
    }
    function pauseTimer() { clearInterval(interval); interval = null; }
    function resetTimer(mins) { pauseTimer(); seconds = mins * 60; updateDisplay(); }

    let tasks = JSON.parse(localStorage.getItem('sprintTasks') || '[]');
    function renderTasks() {
      const list = document.getElementById('taskList');
      list.innerHTML = tasks.map((t, i) => `<li class="${t.done ? 'done' : ''}" onclick="toggleTask(${i})"><span>${t.text}</span><span onclick="event.stopPropagation();deleteTask(${i})">✕</span></li>`).join('');
      localStorage.setItem('sprintTasks', JSON.stringify(tasks));
    }
    function addTask() {
      const input = document.getElementById('taskInput');
      if (!input.value.trim()) return;
      tasks.push({ text: input.value.trim(), done: false });
      input.value = ''; renderTasks();
    }
    function toggleTask(i) { tasks[i].done = !tasks[i].done; renderTasks(); }
    function deleteTask(i) { tasks.splice(i, 1); renderTasks(); }
    renderTasks();
  </script>
</body>
</html>
